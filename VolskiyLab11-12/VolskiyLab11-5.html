<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 5</title>
    <link rel="stylesheet" href="task11.css">
</head>
<body>
    <h2>Завдання 5. Анкетування користувачів</h2>
    <div class="form-container">
        <div class="form-group">
            <label for="ln">Прізвище:</label>
            <input type="text" id="ln" name="lastname" required>
        </div>
        <div class="form-group">
            <label for="fn">Ім'я:</label>
            <input type="text" id="fn" name="firstname" required>
        </div>
        <div class="form-group">
            <label for="pwd">Пароль:</label>
            <input type="password" id="pwd" name="password" required>
        </div>
        <div class="form-group">
            <label for="occupation">Рід занять:</label>
            <select id="occupation" name="occupation">
                <option value="tech" selected>Технічна сфера</option>
                <option value="humanities">Гуманітарна сфера</option>
            </select>
        </div>
        <div class="inline-group">
            <label>Графік роботи:</label><br>
            <label><input type="radio" name="schedule" value="full" checked> Повний день</label>
            <label><input type="radio" name="schedule" value="remote"> Віддалено</label>
        </div>
        <div class="inline-group">
            <label>Умови погодження:</label><br>
            <label><input type="checkbox" name="agree" value="yes" checked> Згоден з умовами</label>
            <label><input type="checkbox" name="news" value="yes"> Отримувати новини</label>
        </div>
        <div class="form-group">
            <label for="bio">Про себе:</label>
            <textarea id="bio" name="bio" rows="5" cols="40"></textarea>
        </div>
        <div class="btn-container">
            <input type="reset" value="Скинути дані">
            <input type="submit" value="Відправити анкету">
        </div>
    </div>
</body>
</html>
